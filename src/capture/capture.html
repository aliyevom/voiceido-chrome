<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voiceido — Capture preview</title>
    <link rel="icon" href="../icons/icon32.png" type="image/png" />
    <link rel="stylesheet" href="capture.css" />
  </head>
  <body>
    <div class="sticky-chrome">
    <header class="toolbar" role="banner">
      <div class="brand">
        <img src="../icons/icon32.png" alt="" width="16" height="16" />
        <span class="brand-name">Voiceido</span>
        <span class="brand-sep" aria-hidden="true">·</span>
        <span class="source" id="source-label" title=""></span>
      </div>

      <nav class="actions" aria-label="Download options">
        <div class="tool-cluster" id="all-actions" hidden role="group" aria-label="All pages as zip">
          <span class="tool-cluster-label">Zip</span>
          <div class="seg seg-tools">
            <button type="button" class="action" id="btn-pdf-all" data-tip="Zip of one PDF per page">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zm-1 1.5L18.5 9H13z"/></svg>
              <span>PDF</span>
            </button>
            <button type="button" class="action" id="btn-image-all" data-tip="Zip of every PNG">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M19 5H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2m-1.5 12H6.5l3.2-4.1 2.3 2.9 1.6-2 3.9 3.2"/></svg>
              <span>PNG</span>
            </button>
            <button type="button" class="action" id="btn-ocr-all" data-tip="OCR every page with readable text, zip PNG + .txt">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 5h16v2H4zm0 4h10v2H4zm0 4h16v2H4zm0 4h10v2H4z"/></svg>
              <span>OCR</span>
            </button>
            <button type="button" class="action" id="btn-analyze-all" data-tip="Analyze every page and Contents photo; zip images + .txt">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 3 9.5 8.5 4 9.2l4.2 3.8L7 19l5-2.8L17 19l-1.2-6L20 9.2 14.5 8.5z"/></svg>
              <span>Analyze</span>
            </button>
          </div>
        </div>

        <div class="icon-pair">
          <button
            type="button"
            class="icon-only debug-bug"
            id="btn-debug"
            aria-label="Save debug dump"
            data-tip="Save capture debug JSON and log it to the console"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                fill="currentColor"
                d="M9.2 3.4 8 4.1l1.2 2.1c-.7.4-1.3.9-1.8 1.6L5 6.6 4.2 8l2.2 1.3c-.2.5-.3 1-.4 1.6H4v1.7h2v.4c0 .4 0 .8.1 1.2L4.2 16 5 17.4l2.3-1.3c.5.7 1.1 1.2 1.8 1.6L8 20l1.2.7 1-2.1c.3.1.5.1.8.1h2c.3 0 .5 0 .8-.1l1 2.1L16 20l-1.3-2.3c.7-.4 1.3-.9 1.8-1.6l2.3 1.3.8-1.4-2.1-1.2c.1-.4.1-.8.1-1.2v-.4h2V10.9h-2.1c0-.6-.1-1.1-.4-1.6L19.8 8 19 6.6l-2.4 1.2c-.5-.7-1.1-1.2-1.8-1.6L16 4.1l-1.2-.7-1 2.1c-.3-.1-.5-.1-.8-.1h-2c-.3 0-.5 0-.8.1zM9.7 10.2h4.6c.4 1 .4 2.2 0 3.2H9.7c-.4-1-.4-2.2 0-3.2"
              />
            </svg>
          </button>
          <button
            type="button"
            class="icon-only settings-gear"
            id="btn-settings"
            aria-label="Backend API settings"
            data-tip="Backend API settings"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                fill="currentColor"
                fill-rule="evenodd"
                d="M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.06-.94l2.03-1.58a.5.5 0 0 0 .12-.61l-1.92-3.32a.5.5 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54A.48.48 0 0 0 13.92 2h-3.84a.48.48 0 0 0-.48.41L9.25 4.95c-.59.24-1.13.56-1.62.94l-2.39-.96a.5.5 0 0 0-.59.22L2.73 8.47a.5.5 0 0 0 .12.61l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94l-2.03 1.58a.5.5 0 0 0-.12.61l1.92 3.32c.12.22.37.3.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.04.24.24.41.48.41h3.84c.24 0 .44-.17.48-.41l.36-2.54c.59-.24 1.12-.56 1.62-.94l2.39.96a.5.5 0 0 0 .59-.22l1.92-3.32a.5.5 0 0 0-.12-.61zM12 15.6a3.6 3.6 0 1 0 0-7.2 3.6 3.6 0 0 0 0 7.2"
              />
            </svg>
          </button>
        </div>
      </nav>
    </header>

    <nav class="browse-rail" id="browse-rail" hidden aria-label="Contents">
      <div class="browse-tabs">
        <span class="contents-label">Contents</span>
        <span class="folder-meta" id="folder-meta"></span>
      </div>
      <div class="browse-panel" id="panel-contents">
        <div class="list-board-head">
          <p class="list-board-sub" id="list-board-sub"></p>
          <button
            type="button"
            class="action list-save"
            id="btn-list-photos"
            data-tip="Save photos into folders named after each item"
          >
            <span>Save photos</span>
          </button>
        </div>
        <div class="list-cards" id="list-cards"></div>
      </div>
    </nav>
    </div>

    <main class="catalog" id="catalog" aria-label="Capture catalog">
      <div class="catalog-track" id="catalog-track">
        <p class="loading">Loading capture…</p>
      </div>
    </main>

    <div class="preview-pop" id="preview-pop" hidden>
      <div class="preview-pop-bar">
        <span class="preview-pop-title" id="preview-pop-title">Page 1</span>
        <button type="button" class="icon-only" id="preview-pop-close" aria-label="Close preview">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M18.3 5.7 12 12l6.3 6.3-1.4 1.4L10.6 13.4 4.3 19.7 2.9 18.3 9.2 12 2.9 5.7 4.3 4.3l6.3 6.3 6.3-6.3z"/></svg>
        </button>
      </div>
      <div class="preview-pop-stage">
        <div class="preview-pop-body" id="preview-pop-body"></div>
        <div class="preview-smoke" id="preview-smoke" aria-hidden="true">
          <div class="preview-smoke-jet" id="preview-smoke-jet"></div>
        </div>
      </div>
    </div>

    <!-- Status toast: shown for short-lived messages (downloads, errors). -->
    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

    <!-- Settings dialog: API base URL + API key for cloud OCR / Analyze. -->
    <dialog id="settings-dialog" class="dialog" aria-labelledby="settings-title">
      <form method="dialog" id="settings-form">
        <h2 id="settings-title">Backend API settings</h2>
        <p class="dialog-help">
          OCR and Analyze run on a Cloud Run service. Paste the URL printed by
          <code>cloud/deploy.sh</code> and the API key you set during deploy.
        </p>

        <label class="field">
          <span>API base URL</span>
          <input
            type="url"
            id="field-url"
            placeholder="https://voiceido-api-xyz.run.app"
            autocomplete="off"
            spellcheck="false"
            required
          />
        </label>

        <label class="field">
          <span>API key (X-API-Key)</span>
          <input
            type="password"
            id="field-key"
            autocomplete="off"
            spellcheck="false"
            required
          />
        </label>

        <p class="dialog-help dialog-test" id="settings-test"></p>

        <div class="dialog-actions">
          <button type="button" id="settings-test-btn" class="dialog-btn">
            Test connection
          </button>
          <span class="dialog-spacer"></span>
          <button type="button" id="settings-cancel" class="dialog-btn ghost">
            Cancel
          </button>
          <button type="submit" id="settings-save" class="dialog-btn primary">
            Save
          </button>
        </div>
      </form>
    </dialog>

    <script type="module" src="capture.js"></script>
  </body>
</html>
